<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Jędrzej Cader</title>
<meta name="robots" content="noindex">

<!-- GitHub Pages serves this file for any URL that doesn't exist. Without it
     you get GitHub's own generic 404, which has no connection to this site.

     It is deliberately self-contained rather than sharing index.html's
     stylesheet: it needs about thirty lines of CSS, and duplicating those is
     cheaper to maintain than the alternative. The tokens below are copied from
     index.html's :root — **if the palette changes there, change it here too.**
     This is the one place on the site where that duplication exists. -->

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23f07a1a' d='M16 21c2.6 2.4 4 4.6 4 6.5a4 4 0 0 1-8 0c0-1.9 1.4-4.1 4-6.5z'/><path fill='%230d55bd' d='M16 2.5c3.9 3.5 6.1 8.2 6.1 13.3 0 2.9-.9 5.9-2.5 8.2H12.4c-1.6-2.3-2.5-5.3-2.5-8.2 0-5.1 2.2-9.8 6.1-13.3z'/><path fill='%230d55bd' d='M11.2 12.2 12.9 16.1 9.2 21.4z'/><path fill='%230d55bd' d='M20.8 12.2 19.1 16.1 22.8 21.4z'/><circle cx='16' cy='13.4' r='2.6' fill='%23fffdfa'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#fffdfa; --ink:#1b1a18; --ink-2:#4c4842; --ink-3:#736d65;
  --rule:#e6e0d6; --accent:#0d55bd; --accent-2:#16b8c8;
  --accent-warm:#f07a1a; --accent-warm-ink:#b85410; --warm-soft:#fdeede;
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.65;
  display:grid;place-items:center;padding:32px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;text-align:center;position:relative;z-index:1}
/* the mission clock, stopped */
.code{display:inline-flex;align-items:center;gap:13px;font-family:var(--mono);
  font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent)}
.code::before,.code::after{content:"";width:34px;height:3px;border-radius:2px;
  background:var(--accent-warm)}
h1{font-family:var(--mono);font-weight:600;font-size:clamp(44px,9vw,86px);
  letter-spacing:.06em;color:var(--accent);margin:22px 0 0;line-height:1}
.sub{font-family:var(--serif);font-size:clamp(19px,2.4vw,27px);line-height:1.25;
  color:var(--ink);margin:14px 0 0}
.note{color:var(--ink-2);font-size:14.5px;margin:12px 0 0}
.home{display:inline-flex;align-items:center;gap:10px;margin-top:30px;
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;text-decoration:none;color:var(--paper);
  background:var(--accent);border:1.5px solid var(--accent);border-radius:999px;
  padding:14px 26px;transition:.24s var(--ease)}
.home:hover{background:var(--accent-warm-ink);border-color:var(--accent-warm-ink);
  transform:translateY(-2px)}
.home svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
/* one orbit ring, the house motif, drifting off the corner */
.deco{position:fixed;bottom:-140px;left:-120px;width:min(460px,46vw);aspect-ratio:1;
  pointer-events:none;color:var(--accent);opacity:.18;z-index:0}
.deco svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.6;
  animation:spin 200s linear infinite;transform-origin:50% 50%}
.deco svg *{vector-effect:non-scaling-stroke}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="deco" aria-hidden="true"><svg viewBox="0 0 400 400">
  <circle cx="200" cy="200" r="188"/><circle cx="200" cy="200" r="126"/><circle cx="200" cy="200" r="66"/>
  <ellipse cx="200" cy="200" rx="188" ry="62" transform="rotate(-24 200 200)"/>
  <circle cx="200" cy="200" r="7" fill="currentColor" stroke="none"/>
  <circle cx="326" cy="252" r="5" fill="currentColor" stroke="none"/>
</svg></div>

<main class="wrap">
  <p class="code">Signal lost</p>
  <h1>404</h1>
  <p class="sub">This page isn't where the map says it is.</p>
  <p class="note">Either the link was wrong, or it used to exist and doesn't any more.
     Neither is your fault.</p>
  <a class="home" href="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back to the start
  </a>
</main>

</body>
</html>
